name: OTTAM-001 One-Time Production

on:
  push:
    branches:
      - run/OTTAM-001

concurrency:
  group: ottam-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Magnific MCP
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and Magnific MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm install --no-save @modelcontextprotocol/sdk

      - name: Restore latest OTTAM-001 production checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          CHECKPOINT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("ottam-001-")))) | sort_by(.created_at) | reverse | .[0].id')
          if [ -n "$CHECKPOINT_ID" ] && [ "$CHECKPOINT_ID" != "null" ]; then
            echo "Restoring OTTAM-001 checkpoint artifact ${CHECKPOINT_ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHECKPOINT_ID}/zip" > /tmp/ottam-checkpoint.zip
            unzip -o /tmp/ottam-checkpoint.zip -d runtime
          else
            echo "No previous OTTAM-001 checkpoint found; starting fresh."
          fi

      - name: Normalize existing finished checkpoint to SOP Kokoro 1.0x
        env:
          KOKORO_BASE_URL: https://theplantrastore--kokoro-tts-web.modal.run
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from ottam.tts import generate_episode_narration

          episode = Path('runtime/episodes/OTTAM-001')
          state_path = Path('runtime/state/OTTAM-001.json')
          meta_path = episode / 'audio' / 'tts_metadata.json'
          storyboard_path = episode / 'storyboard.json'

          if not state_path.exists():
              print('No checkpoint state yet; normal orchestrator will start fresh.')
              raise SystemExit(0)

          state = json.loads(state_path.read_text())
          current_speed = None
          if meta_path.exists():
              try:
                  current_speed = float(json.loads(meta_path.read_text()).get('speed'))
              except Exception:
                  pass

          if current_speed == 1.0:
              if state.get('status') != 'VIDEO_READY':
                  state['quarantined'] = False
                  state['status'] = 'PENDING'
                  state['attempts'] = 0
                  state['last_error'] = None
                  state_path.write_text(json.dumps(state, indent=2))
              print('Checkpoint already uses SOP Kokoro speed 1.0x.')
              raise SystemExit(0)

          if not storyboard_path.exists():
              state['stage'] = 'generate_tts'
              state['status'] = 'PENDING'
              state['quarantined'] = False
              state['attempts'] = 0
              state['last_error'] = None
              state_path.write_text(json.dumps(state, indent=2))
              print('No existing storyboard to preserve; resuming from generate_tts.')
              raise SystemExit(0)

          storyboard = json.loads(storyboard_path.read_text())
          scenes = storyboard.get('scenes') or []
          if not scenes:
              raise SystemExit('Existing storyboard has no scenes; refusing unsafe retime.')

          old_end = float(scenes[-1]['end'])
          if old_end <= 0:
              raise SystemExit('Existing storyboard has invalid final timestamp.')

          print(f'Regenerating approved narration at SOP speed 1.0x; preserving {len(scenes)} existing visual prompts/images.')
          metadata = generate_episode_narration(
              'OTTAM-001',
              runtime_root=Path('runtime/episodes'),
              base_url='https://theplantrastore--kokoro-tts-web.modal.run',
              voice='am_echo',
              speed=1.0,
          )
          new_duration = float(metadata.get('duration_seconds') or 0.0)
          if new_duration <= 0:
              raise SystemExit('SOP narration returned invalid duration.')

          ratio = new_duration / old_end
          previous_end = 0.0
          for idx, scene in enumerate(scenes):
              start = float(scene['start']) * ratio
              end = float(scene['end']) * ratio
              if idx == 0:
                  start = 0.0
              else:
                  start = previous_end
              if idx == len(scenes) - 1:
                  end = new_duration
              scene['start'] = round(start, 3)
              scene['end'] = round(end, 3)
              previous_end = end
          storyboard['retimed_for_tts_speed'] = 1.0
          storyboard['retime_ratio'] = ratio
          storyboard_path.write_text(json.dumps(storyboard, indent=2, ensure_ascii=False))

          for path in [episode / 'final.mp4', episode / 'video_qa.json']:
              if path.exists():
                  path.unlink()
          render_tmp = episode / 'render_tmp'
          if render_tmp.exists():
              shutil.rmtree(render_tmp)

          state['stage'] = 'assemble_video'
          state['status'] = 'PENDING'
          state['quarantined'] = False
          state['attempts'] = 0
          state['last_error'] = None
          state_path.write_text(json.dumps(state, indent=2))
          print(f'SOP narration duration={new_duration:.1f}s; storyboard retimed by ratio={ratio:.4f}; resuming at assemble_video.')
          PY

      - name: Restore latest encrypted Magnific OAuth session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/magnific-auth
          AUTH_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=magnific-oauth-session&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$AUTH_ID" ] || [ "$AUTH_ID" = "null" ]; then
            echo "No renewable Magnific OAuth session artifact is available."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTH_ID}/zip" > /tmp/magnific-oauth.zip
          unzip -o /tmp/magnific-oauth.zip -d runtime/magnific-auth
          test -f runtime/magnific-auth/magnific-oauth-session.enc.json

      - name: Run OTTAM-001 production orchestrator
        env:
          OTTAM_EPISODE_ID: OTTAM-001
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          MAGNIFIC_OAUTH_SESSION_FILE: runtime/magnific-auth/magnific-oauth-session.enc.json
          KOKORO_SPEED: "1.0"
        run: ottam-run

      - name: Preserve renewed Magnific OAuth session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-oauth-session
          path: runtime/magnific-auth/magnific-oauth-session.enc.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve OTTAM-001 outputs, state and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottam-001-${{ github.run_id }}
          path: |
            runtime/episodes/
            runtime/state/
            runtime/logs/
          if-no-files-found: ignore
          retention-days: 30
