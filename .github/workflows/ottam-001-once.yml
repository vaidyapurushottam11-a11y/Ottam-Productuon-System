name: OTTAM-001 One-Time Production

on:
  push:
    branches:
      - run/OTTAM-001

concurrency:
  group: ottam-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Magnific MCP
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and Magnific MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm install --no-save @modelcontextprotocol/sdk

      - name: Restore latest OTTAM-001 production checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          CHECKPOINT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts | map(select(.expired == false and (.name | startswith("ottam-001-")))) | sort_by(.created_at) | reverse | .[0].id')
          if [ -n "$CHECKPOINT_ID" ] && [ "$CHECKPOINT_ID" != "null" ]; then
            echo "Restoring OTTAM-001 checkpoint artifact ${CHECKPOINT_ID}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHECKPOINT_ID}/zip" > /tmp/ottam-checkpoint.zip
            unzip -o /tmp/ottam-checkpoint.zip -d runtime
            if [ -f runtime/state/OTTAM-001.json ]; then
              python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runtime/state/OTTAM-001.json')
          s = json.loads(p.read_text())
          if s.get('status') != 'VIDEO_READY':
              s['quarantined'] = False
              s['status'] = 'PENDING'
              s['attempts'] = 0
              s['last_error'] = None
              p.write_text(json.dumps(s, indent=2))
              print(f"Resuming OTTAM-001 from stage={s.get('stage')}")
          else:
              print('OTTAM-001 is already VIDEO_READY')
          PY
            fi
          else
            echo "No previous OTTAM-001 checkpoint found; starting fresh."
          fi

      - name: Restore latest encrypted Magnific OAuth session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/magnific-auth
          AUTH_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=magnific-oauth-session&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$AUTH_ID" ] || [ "$AUTH_ID" = "null" ]; then
            echo "No renewable Magnific OAuth session artifact is available."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTH_ID}/zip" > /tmp/magnific-oauth.zip
          unzip -o /tmp/magnific-oauth.zip -d runtime/magnific-auth
          test -f runtime/magnific-auth/magnific-oauth-session.enc.json

      - name: Run OTTAM-001 production orchestrator
        env:
          OTTAM_EPISODE_ID: OTTAM-001
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          MAGNIFIC_OAUTH_SESSION_FILE: runtime/magnific-auth/magnific-oauth-session.enc.json
          KOKORO_SPEED: "0.80"
        run: ottam-run

      - name: Preserve renewed Magnific OAuth session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-oauth-session
          path: runtime/magnific-auth/magnific-oauth-session.enc.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve OTTAM-001 outputs, state and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottam-001-${{ github.run_id }}
          path: |
            runtime/episodes/
            runtime/state/
            runtime/logs/
          if-no-files-found: ignore
          retention-days: 30
