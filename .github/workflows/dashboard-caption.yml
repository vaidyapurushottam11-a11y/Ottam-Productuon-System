name: OTTAM Dashboard Caption
run-name: Caption ${{ inputs.episode_id }}

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Finished OTTAM episode id"
        required: true
        type: string
      instruction:
        description: "Optional small regeneration instruction"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ottam-caption-${{ inputs.episode_id }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Restore latest episode artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          mkdir -p runtime
          NAME="ottam-production-${EPISODE_ID}"
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          test -n "$ID" && test "$ID" != "null"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}/zip" > /tmp/episode.zip
          unzip -o /tmp/episode.zip -d runtime
      - name: Regenerate caption package once
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          OTTAM_EPISODE_ID: ${{ inputs.episode_id }}
          OTTAM_REGEN_INSTRUCTION: ${{ inputs.instruction }}
        run: ottam-caption-regenerate
      - uses: actions/upload-artifact@v4
        with:
          name: ottam-caption-${{ inputs.episode_id }}
          path: |
            runtime/episodes/${{ inputs.episode_id }}/upload_package.json
            runtime/episodes/${{ inputs.episode_id }}/upload_package_versions/
          retention-days: 30
