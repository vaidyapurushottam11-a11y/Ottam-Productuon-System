name: OTTAM Autonomous Production
run-name: OTTAM Production ${{ inputs.episode_id }} — ${{ inputs.selected_topic_title }}

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Dashboard episode id"
        required: true
        type: string
      selected_topic_title:
        description: "Selected topic title for dashboard recovery"
        required: true
        type: string
      selected_topic_json:
        description: "Selected scored topic JSON"
        required: true
        type: string
      resume_failed:
        description: "Unlock a failed/quarantined checkpoint and resume from its recorded stage"
        required: false
        default: false
        type: boolean
      script_approved:
        description: "Continue beyond Script QA after explicit dashboard approval"
        required: false
        default: false
        type: boolean
      script_revision_instruction:
        description: "Optional dashboard instruction for revising the saved script before approval"
        required: false
        default: ""
        type: string

concurrency:
  group: ottam-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OTTAM_EPISODE_ID: ${{ inputs.episode_id }}
      XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      MAGNIFIC_OAUTH_SESSION_FILE: runtime/magnific-auth/magnific-oauth-session.enc.json
      KOKORO_SPEED: "1.0"

    steps:
      - uses: actions/checkout@v4
      - name: Setup · Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup · Node.js
        if: ${{ inputs.script_approved }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup · Media tools
        if: ${{ inputs.script_approved }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Setup · Project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if [ "${{ inputs.script_approved }}" = "true" ]; then
            npm install --no-save @modelcontextprotocol/sdk
          fi

      - name: Setup · Restore episode checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          mkdir -p runtime
          ARTIFACT_NAME="ottam-production-${EPISODE_ID}"
          CHECKPOINT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -n "$CHECKPOINT_ID" ] && [ "$CHECKPOINT_ID" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${CHECKPOINT_ID}/zip" > /tmp/episode-checkpoint.zip
            unzip -o /tmp/episode-checkpoint.zip -d runtime
          fi

      - name: Setup · Seed selected topic and resume policy
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
          SELECTED_TOPIC_JSON: ${{ inputs.selected_topic_json }}
          RESUME_FAILED: ${{ inputs.resume_failed }}
          SCRIPT_APPROVED: ${{ inputs.script_approved }}
          SCRIPT_REVISION_INSTRUCTION: ${{ inputs.script_revision_instruction }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          episode_id = os.environ["EPISODE_ID"]
          topic = json.loads(os.environ["SELECTED_TOPIC_JSON"])
          resume_failed = os.environ.get("RESUME_FAILED", "false").lower() == "true"
          script_approved = os.environ.get("SCRIPT_APPROVED", "false").lower() == "true"
          revision_instruction = os.environ.get("SCRIPT_REVISION_INSTRUCTION", "").strip()
          episode_dir = Path("runtime/episodes") / episode_id
          state_dir = Path("runtime/state")
          episode_dir.mkdir(parents=True, exist_ok=True)
          state_dir.mkdir(parents=True, exist_ok=True)
          topic_path = episode_dir / "topic.json"
          state_path = state_dir / f"{episode_id}.json"

          if not topic_path.exists():
              topic_path.write_text(
                  json.dumps({"winner": topic, "source": "dashboard_selection"}, indent=2, ensure_ascii=False),
                  encoding="utf-8",
              )

          if not state_path.exists():
              state_path.write_text(
                  json.dumps(
                      {
                          "episode_id": episode_id,
                          "stage": "research",
                          "status": "PENDING",
                          "attempts": 0,
                          "last_error": None,
                          "quarantined": False,
                      },
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          state = json.loads(state_path.read_text(encoding="utf-8"))

          if revision_instruction:
              # A requested edit should reuse topic/research but regenerate script,
              # fact-check and QA before asking for approval again.
              (episode_dir / "script_revision_instruction.txt").write_text(revision_instruction, encoding="utf-8")
              state["stage"] = "write_script"
              state["status"] = "PENDING"
              state["attempts"] = 0
              state["quarantined"] = False
              state["last_error"] = None
          elif resume_failed:
              state["status"] = "PENDING"
              state["attempts"] = 0
              state["quarantined"] = False
              state["last_error"] = None
          elif script_approved and state.get("status") == "AWAITING_SCRIPT_APPROVAL":
              # Script QA already advanced the checkpoint to generate_tts.
              state["status"] = "PENDING"
              state["attempts"] = 0
              state["last_error"] = None

          state_path.write_text(json.dumps(state, indent=2), encoding="utf-8")
          PY

      - name: Setup · Detect resume stage
        id: resume_stage
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          mapping = {
              "research": 1,
              "write_script": 2,
              "fact_check": 3,
              "script_qa": 4,
              "generate_tts": 5,
              "plan_visuals": 6,
              "generate_images": 7,
              "visual_qa": 8,
              "assemble_video": 9,
              "video_qa": 10,
          }
          episode_id = os.environ["EPISODE_ID"]
          state = json.loads((Path("runtime/state") / f"{episode_id}.json").read_text())
          stage = state.get("stage", "research")
          print(f"start_index={mapping.get(stage, 1)}")
          print(f"start_stage={stage}")
          PY

      - name: Setup · Restore Magnific session
        if: ${{ inputs.script_approved }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/magnific-auth
          AUTH_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=magnific-oauth-session&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$AUTH_ID" ] || [ "$AUTH_ID" = "null" ]; then
            echo "No renewable Magnific OAuth session artifact is available."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTH_ID}/zip" > /tmp/magnific-oauth.zip
          unzip -o /tmp/magnific-oauth.zip -d runtime/magnific-auth
          test -f runtime/magnific-auth/magnific-oauth-session.enc.json

      - name: Stage 1/10 · Research
        if: ${{ fromJSON(steps.resume_stage.outputs.start_index) <= 1 }}
        env: { OTTAM_STOP_AFTER_STAGE: research }
        run: ottam-run
      - name: Stage 2/10 · Write script
        if: ${{ fromJSON(steps.resume_stage.outputs.start_index) <= 2 }}
        env: { OTTAM_STOP_AFTER_STAGE: write_script }
        run: ottam-run
      - name: Stage 3/10 · Fact check
        if: ${{ fromJSON(steps.resume_stage.outputs.start_index) <= 3 }}
        env: { OTTAM_STOP_AFTER_STAGE: fact_check }
        run: ottam-run
      - name: Stage 4/10 · Script QA
        if: ${{ fromJSON(steps.resume_stage.outputs.start_index) <= 4 }}
        env: { OTTAM_STOP_AFTER_STAGE: script_qa }
        run: ottam-run

      - name: Approval · Pause for script review
        if: ${{ !inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 4 }}
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          episode_id = os.environ["EPISODE_ID"]
          path = Path("runtime/state") / f"{episode_id}.json"
          state = json.loads(path.read_text())
          state["status"] = "AWAITING_SCRIPT_APPROVAL"
          state["last_error"] = None
          state["quarantined"] = False
          path.write_text(json.dumps(state, indent=2))
          print("Script is ready for dashboard approval. Production will not spend TTS or image credits yet.")
          PY

      - name: Stage 5/10 · Generate narration
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 5 }}
        env: { OTTAM_STOP_AFTER_STAGE: generate_tts }
        run: ottam-run
      - name: Stage 6/10 · Plan visuals
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 6 }}
        env: { OTTAM_STOP_AFTER_STAGE: plan_visuals }
        run: ottam-run
      - name: Stage 7/10 · Generate images
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 7 }}
        env: { OTTAM_STOP_AFTER_STAGE: generate_images }
        run: ottam-run
      - name: Stage 8/10 · Visual QA
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 8 }}
        env: { OTTAM_STOP_AFTER_STAGE: visual_qa }
        run: ottam-run
      - name: Stage 9/10 · Assemble video
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 9 }}
        env: { OTTAM_STOP_AFTER_STAGE: assemble_video }
        run: ottam-run
      - name: Stage 10/10 · Video QA
        if: ${{ inputs.script_approved && fromJSON(steps.resume_stage.outputs.start_index) <= 10 }}
        env: { OTTAM_STOP_AFTER_STAGE: video_qa }
        run: ottam-run

      - name: Packaging · Require VIDEO_READY
        if: ${{ inputs.script_approved }}
        env:
          EPISODE_ID: ${{ inputs.episode_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          episode_id = os.environ["EPISODE_ID"]
          state = json.loads((Path("runtime/state") / f"{episode_id}.json").read_text())
          if state.get("status") != "VIDEO_READY" or state.get("quarantined"):
              raise SystemExit(f"Episode is not VIDEO_READY: {state}")
          PY
      - name: Packaging · YouTube text
        if: ${{ inputs.script_approved }}
        run: test -f "runtime/episodes/${OTTAM_EPISODE_ID}/upload_package.json" || ottam-upload-package
      - name: Packaging · Thumbnail
        if: ${{ inputs.script_approved }}
        run: test -f "runtime/episodes/${OTTAM_EPISODE_ID}/thumbnail.jpg" || ottam-thumbnail-generate

      - name: Finalize · Preserve Magnific session
        if: ${{ always() && inputs.script_approved }}
        uses: actions/upload-artifact@v4
        with:
          name: magnific-oauth-session
          path: runtime/magnific-auth/magnific-oauth-session.enc.json
          if-no-files-found: warn
          retention-days: 90
      - name: Finalize · Preserve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottam-production-${{ inputs.episode_id }}
          path: |
            runtime/episodes/
            runtime/state/
            runtime/logs/
          if-no-files-found: ignore
          retention-days: 30
