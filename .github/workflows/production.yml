name: OTTAM Autonomous Production

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Optional explicit episode id"
        required: false
        type: string
  schedule:
    # Temporary development schedule. Publishing cadence will be locked separately.
    - cron: "30 0 * * *"

concurrency:
  group: ottam-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run production orchestrator
        env:
          OTTAM_EPISODE_ID: ${{ inputs.episode_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: ottam-run

      - name: Preserve production state and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottam-production-state-${{ github.run_id }}
          path: |
            runtime/state/
            runtime/logs/
          if-no-files-found: ignore
          retention-days: 30
