name: OTTAM Autonomous Production

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Optional explicit episode id"
        required: false
        type: string

concurrency:
  group: ottam-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run production orchestrator
        env:
          OTTAM_EPISODE_ID: ${{ inputs.episode_id }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: ottam-run

      - name: Preserve production outputs, state and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ottam-production-${{ github.run_id }}
          path: |
            runtime/episodes/
            runtime/state/
            runtime/logs/
          if-no-files-found: ignore
          retention-days: 30
