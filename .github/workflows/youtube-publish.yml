name: OTTAM YouTube Publish

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: "Episode id to publish"
        required: false
        type: string
      source_run_id:
        description: "Optional production workflow run id"
        required: false
        type: string
  workflow_run:
    workflows:
      - OTTAM Autonomous Production
    types: [completed]
  push:
    branches:
      - publish/**

concurrency:
  group: ottam-youtube-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OTTAM package and Magnific MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm install --no-save @modelcontextprotocol/sdk

      - name: Resolve episode and production artifact
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_EPISODE: ${{ inputs.episode_id }}
          INPUT_RUN: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_RUN: ${{ github.event.workflow_run.id }}
        run: |
          EPISODE="$INPUT_EPISODE"
          SOURCE_RUN="$INPUT_RUN"

          if [ -z "$SOURCE_RUN" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            SOURCE_RUN="$SOURCE_WORKFLOW_RUN"
          fi

          if [ -z "$EPISODE" ] && [[ "$GITHUB_REF_NAME" == publish/* ]]; then
            EPISODE="${GITHUB_REF_NAME#publish/}"
          fi

          if [ -n "$SOURCE_RUN" ]; then
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts?per_page=100" \
              --jq '.artifacts | map(select(.expired == false and .name != "magnific-oauth-session" and .name != "youtube-oauth-session")) | sort_by(.created_at) | reverse | .[0].id')
          else
            if [ -z "$EPISODE" ]; then
              echo "episode_id is required when no source workflow run is supplied"
              exit 1
            fi
            PREFIX=$(echo "$EPISODE" | tr '[:upper:]' '[:lower:]')
            ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq ".artifacts | map(select(.expired == false and (.name | startswith(\"${PREFIX}-\")))) | sort_by(.created_at) | reverse | .[0].id")
          fi

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "No production artifact found"
            exit 1
          fi

          mkdir -p runtime
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/production.zip
          unzip -o /tmp/production.zip -d runtime

          if [ -z "$EPISODE" ]; then
            STATE_FILES=(runtime/state/*.json)
            if [ "${#STATE_FILES[@]}" -ne 1 ]; then
              echo "Unable to infer a single episode from production artifact"
              exit 1
            fi
            EPISODE=$(basename "${STATE_FILES[0]}" .json)
          fi

          echo "episode_id=$EPISODE" >> "$GITHUB_OUTPUT"
          echo "production_artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing episode $EPISODE from artifact $ARTIFACT_ID"

      - name: Restore previous idempotent publish state
        env:
          GH_TOKEN: ${{ github.token }}
          EPISODE: ${{ steps.resolve.outputs.episode_id }}
        run: |
          STATE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=youtube-publish-state-${EPISODE}&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -n "$STATE_ID" ] && [ "$STATE_ID" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ID}/zip" > /tmp/publish-state.zip
            unzip -o /tmp/publish-state.zip -d runtime
          fi

      - name: Restore encrypted YouTube OAuth session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/youtube-auth
          AUTH_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=youtube-oauth-session&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$AUTH_ID" ] || [ "$AUTH_ID" = "null" ]; then
            echo "No YouTube OAuth session found. Run OTTAM YouTube Authorization first."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTH_ID}/zip" > /tmp/youtube-auth.zip
          unzip -o /tmp/youtube-auth.zip -d runtime/youtube-auth
          test -f runtime/youtube-auth/youtube-oauth-session.enc.json

      - name: Restore encrypted Magnific OAuth session for thumbnail generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/magnific-auth
          AUTH_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=magnific-oauth-session&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$AUTH_ID" ] || [ "$AUTH_ID" = "null" ]; then
            echo "No Magnific OAuth session found; dedicated thumbnail generation cannot proceed."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTH_ID}/zip" > /tmp/magnific-auth.zip
          unzip -o /tmp/magnific-auth.zip -d runtime/magnific-auth
          test -f runtime/magnific-auth/magnific-oauth-session.enc.json

      - name: Upload video and metadata to YouTube
        env:
          OTTAM_EPISODE_ID: ${{ steps.resolve.outputs.episode_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          YOUTUBE_OAUTH_SESSION_FILE: runtime/youtube-auth/youtube-oauth-session.enc.json
        run: ottam-youtube-publish

      - name: Generate dedicated OTTAM thumbnail and replace remote thumbnail
        env:
          OTTAM_EPISODE_ID: ${{ steps.resolve.outputs.episode_id }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          MAGNIFIC_OAUTH_SESSION_FILE: runtime/magnific-auth/magnific-oauth-session.enc.json
          YOUTUBE_OAUTH_SESSION_FILE: runtime/youtube-auth/youtube-oauth-session.enc.json
        run: ottam-youtube-thumbnail

      - name: Preserve renewed YouTube OAuth session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-oauth-session
          path: runtime/youtube-auth/youtube-oauth-session.enc.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve renewed Magnific OAuth session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-oauth-session
          path: runtime/magnific-auth/magnific-oauth-session.enc.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve idempotent publish state and final thumbnail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-publish-state-${{ steps.resolve.outputs.episode_id }}
          path: |
            runtime/episodes/${{ steps.resolve.outputs.episode_id }}/youtube_publish_result.json
            runtime/episodes/${{ steps.resolve.outputs.episode_id }}/thumbnail.jpg
            runtime/episodes/${{ steps.resolve.outputs.episode_id }}/thumbnail_generated.png
            runtime/episodes/${{ steps.resolve.outputs.episode_id }}/thumbnail_metadata.json
          if-no-files-found: warn
          retention-days: 90
