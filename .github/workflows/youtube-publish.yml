name: OTTAM YouTube Publish (Parked)

# Manual-upload mode is now the active product behavior.
# The YouTube API client remains in the repository for future reactivation,
# but no production completion, push, or schedule can publish a video.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Automatic YouTube publishing is parked."
          echo "Use the OTTAM Production Studio to download the MP4, thumbnail, title, description, hashtags and tags for manual upload."
