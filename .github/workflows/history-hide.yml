name: OTTAM History Hide
run-name: Hide history ${{ inputs.episode_id }}

on:
  workflow_dispatch:
    inputs:
      episode_id:
        description: Episode to hide from dashboard history
        required: true
        type: string

permissions:
  contents: read

jobs:
  mark-hidden:
    runs-on: ubuntu-latest
    steps:
      - name: Record dashboard history tombstone
        run: echo "${{ inputs.episode_id }} hidden from OTTAM dashboard history"
