name: OTTAM Code Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/autonomous-production-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile Python source
        run: python -m compileall -q src
      - name: Validate orchestrator imports
        run: python -c "from ottam.cli import build_handlers; from ottam.orchestrator import Stage; h=build_handlers(); assert set(h) == set(Stage)"
      - name: Validate dashboard composition
        run: python -c "from ottam.dashboard_app import app; assert app is not None; assert 'approve_script' in app.view_functions; assert 'production_history' in app.view_functions"
      - name: Run regression tests
        run: pytest -q
