name: Magnific MCP GPT-2 Auto Smoke

on:
  push:
    branches:
      - test/magnific-mcp-smoke

permissions:
  contents: read

jobs:
  token-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe Magnific MCP token audiences
        run: node scripts/magnific_token_probe.mjs

      - name: Upload token probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-token-probe-${{ github.run_id }}
          path: runtime/magnific-token-probe/
          if-no-files-found: warn
          retention-days: 7
