name: Magnific MCP GPT-2 Auto Smoke

on:
  push:
    branches:
      - test/magnific-mcp-smoke

permissions:
  contents: read

jobs:
  m2m-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP SDK
        run: npm install --no-save @modelcontextprotocol/sdk

      - name: Run Magnific machine-to-machine GPT-2 smoke
        run: node scripts/magnific_m2m_smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-m2m-gpt2-smoke-${{ github.run_id }}
          path: runtime/magnific-m2m-smoke/
          if-no-files-found: warn
          retention-days: 7
