name: Magnific MCP GPT-2 Device Authorization

on:
  push:
    branches:
      - test/magnific-mcp-smoke
    paths-ignore:
      - runtime/device-auth-request.json

concurrency:
  group: magnific-device-auth
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start one-time Magnific device authorization
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
        run: node scripts/magnific_device_auth.mjs

      - name: Upload encrypted OAuth session
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-oauth-session
          path: runtime/magnific-auth/
          if-no-files-found: warn
          retention-days: 90
