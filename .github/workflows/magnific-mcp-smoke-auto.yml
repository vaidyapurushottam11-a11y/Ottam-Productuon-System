name: Magnific MCP GPT-2 User Smoke

on:
  push:
    branches:
      - test/magnific-mcp-smoke

concurrency:
  group: magnific-gpt2-user-smoke
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install MCP SDK
        run: npm install --no-save @modelcontextprotocol/sdk

      - name: Restore encrypted Magnific OAuth session
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime/magnific-auth
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9729681807/zip > /tmp/magnific-oauth.zip
          unzip -o /tmp/magnific-oauth.zip -d runtime/magnific-auth
          test -f runtime/magnific-auth/magnific-oauth-session.enc.json

      - name: Run GPT-2 low-quality 16:9 smoke
        env:
          MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
        run: node scripts/magnific_user_oauth_smoke.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnific-gpt2-user-smoke-${{ github.run_id }}
          path: runtime/magnific-user-smoke/
          if-no-files-found: warn
          retention-days: 14
